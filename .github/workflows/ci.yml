# =============================================================================
# PR 마다 자동 실행되는 검증.
#
#   changes       무엇이 바뀌었는지 판정 (아래 job 들의 실행 여부를 정합니다)
#   version-lock  pyproject.toml 을 고치고 `uv lock` 을 안 돌린 PR 을 막습니다.  [항상]
#   test          tests 폴더가 있는 런타임을 각자의 uv 환경으로 돌립니다.        [항상]
#   docker-build  이미지가 실제로 빌드되는지 봅니다.              [이미지 입력이 바뀔 때]
#   dag-import    Airflow 가 DAG 를 읽을 수 있는지 봅니다.            [airflow 가 바뀔 때]
#
# 로컬에서는 `make check` / `make test` / `make build` 로 전체 검증할 수 있습니다.
# AWS 자격증명은 쓰지 않습니다 — 빌드만 하고 어디에도 푸시하지 않습니다.
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# 같은 PR 에 연달아 push 하면 이전 실행은 취소 (낭비 방지)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 이미지에 들어가는 파일이 안 바뀌었으면 굽는 결과가 직전과 같습니다. 각 Dockerfile 이
  # COPY 하는 건 의존성 파일과 libs/pipeline_core 뿐이라, DAG·테스트·핸들러를 고쳐도
  # 이미지는 그대로입니다. 그래서 소스가 아니라 **이미지의 입력**을 기준으로 거릅니다.
  #
  #   main/<runtime>/Dockerfile 과 각 pyproject.toml, uv.lock
  #
  # airflow 만 libs/pipeline_core 를 COPY 하지 않아 조건에서 빠져 있습니다.
  changes:
    name: 변경 판정
    runs-on: ubuntu-latest
    outputs:
      # 이미지를 다시 구워야 하는 런타임 디렉터리 이름 배열. 예) ["airflow","aws_lambda"]
      runtimes: ${{ steps.images.outputs.changes }}
      dags: ${{ steps.dags.outputs.dags }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: images
        with:
          filters: |
            airflow:
              - 'main/airflow/Dockerfile'
              - 'main/airflow/pyproject.toml'
              - 'main/airflow/uv.lock'
              - 'Makefile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            spark:
              - 'main/spark/Dockerfile'
              - 'main/spark/pyproject.toml'
              - 'main/spark/uv.lock'
              - 'sub/spark/**'
              - 'shared/spark/**'
              - 'libs/pipeline_core/**'
              - 'Makefile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
            aws_lambda:
              - 'main/aws_lambda/Dockerfile'
              - 'main/aws_lambda/pyproject.toml'
              - 'main/aws_lambda/uv.lock'
              - 'sub/aws_lambda/**'
              - 'shared/aws_lambda/**'
              - 'libs/pipeline_core/**'
              - 'Makefile'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

      # DAG 검증은 이미지와 조건이 다릅니다. dags/ 를 고치면 이미지는 그대로지만
      # DAG 는 다시 읽어봐야 합니다.
      - uses: dorny/paths-filter@v3
        id: dags
        with:
          filters: |
            dags:
              - 'main/airflow/dags/**'
              - 'main/airflow/scripts/**'
              - 'sub/airflow/**'
              - 'shared/airflow/**'
              - 'main/airflow/pyproject.toml'
              - 'main/airflow/uv.lock'
              - '.github/workflows/ci.yml'

  version-lock:
    name: 버전 잠금 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          # Dockerfile에서 lockfile을 export하는 uv 버전과 맞출 것
          version: "0.12.2"
          enable-cache: true

      - name: 락파일 드리프트 검증
        run: make check

      - name: 실패 시 안내
        if: failure()
        run: |
          echo "::error::pyproject.toml 과 uv.lock 이 어긋났습니다."
          echo "고친 런타임 폴더에서 'uv lock' 을 돌리고, uv.lock 도 같이 커밋하세요."
          echo "  예) cd main/airflow && uv lock"

  # 변경 파일을 전용 테스트와 공통 계약 테스트로 매핑합니다. 공통 코드나 알 수 없는
  # Python 경로가 바뀌면 전체 테스트로 승격해 선택 누락을 조용히 통과시키지 않습니다.
  # tesseract 바이너리는 필요 없습니다 — 테스트가 OCR 경로를 타지 않습니다.
  #
  # 런타임별로 쪼개지 않습니다. 전체가 1분 안쪽이라 쪼개도 가장 느린 하나가 남고,
  # libs/pipeline_core 는 세 런타임 공용이며 DAG 는 lambda/functions 핸들러를 직접
  # 부릅니다 — 조건을 좁히면 아끼는 시간보다 놓치는 회귀가 비쌉니다.
  test:
    name: 영향받는 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.2"
          enable-cache: true

      - name: 변경 기반 pytest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python .github/scripts/select_tests.py --base "$BASE_SHA" --head "$HEAD_SHA" --run

  # 푸시하지 않고 빌드만 합니다. Dockerfile 이 깨진 PR 을 여기서 막는 게 목적입니다.
  # 세 빌드는 서로 의존이 없어서 런타임별로 러너를 나눠 씁니다 — 벽시계 시간이
  # 셋의 합이 아니라 가장 느린 하나(airflow)가 됩니다.
  # 레이어 캐시로 줄이는 방향은 오히려 느려서 접었습니다 (#184).
  docker-build:
    name: 이미지 빌드
    needs: changes
    # 바뀐 런타임이 하나도 없으면 job 자체가 뜨지 않습니다 (빈 matrix 는 에러라 먼저 거릅니다).
    if: needs.changes.outputs.runtimes != '[]'
    runs-on: ubuntu-latest
    strategy:
      # 한 런타임이 깨져도 나머지 결과를 봐야 어디까지 성한지 압니다.
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(needs.changes.outputs.runtimes) }}
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 빌드
        run: make build RUNTIMES=main/${{ matrix.runtime }}

      - name: 실패 시 안내
        if: failure()
        run: |
          echo "::error::${{ matrix.runtime }} 이미지 빌드가 실패했습니다."
          echo "로컬에서 같은 검사를 돌릴 수 있습니다:"
          echo "  make build RUNTIMES=main/${{ matrix.runtime }}"

  # Airflow 는 import 에 실패한 DAG 를 조용히 건너뜁니다. 배포 후 "화면에 안 보인다"
  # 로 발견되기 전에 여기서 잡습니다.
  #
  # 이미지 빌드 job 에서 떼어냈습니다. 붙어 있으면 dags/ 만 고친 PR 에서 이미지가
  # 스킵되면서 이 검증까지 함께 스킵됩니다 — 정작 필요한 때 안 돌게 됩니다.
  # 이미지 대신 airflow 의 uv 환경으로 돌립니다. import 되는지만 보므로 결과는 같고
  # 이미지를 굽지 않아 훨씬 빠릅니다.
  dag-import:
    name: DAG import 검증
    needs: changes
    if: needs.changes.outputs.dags == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.2"
          enable-cache: true

      - name: DAG import 검증
        working-directory: main/airflow
        run: |
          uv run --frozen python scripts/check_dags.py
          uv run --frozen python scripts/check_dags.py ../../sub/airflow/dags

      - name: 실패 시 안내
        if: failure()
        run: |
          echo "::error::DAG import 검증이 실패했습니다."
          echo "로컬에서 같은 검사를 돌릴 수 있습니다:"
          echo "  cd main/airflow && uv run --frozen python scripts/check_dags.py"
