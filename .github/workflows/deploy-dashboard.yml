# =============================================================================
# 대시보드 이미지 배포.
#
#   develop 에 머지되면 이미지를 굽고 ECR 에 올린 뒤, EC2 의 컨테이너를 그 이미지로
#   갈아끼웁니다. 팀원은 머지만 하면 됩니다.
#
#
# 사전 준비 (AWS 콘솔 — 1회, 완료됨)
#   IAM 역할  theone-github-actions-dashboard-deploy
#             ECR 은 theone-dashboard-server 만, SSM 은 인스턴스 1대 + AWS-RunShellScript 만
#   Variables AWS_ROLE_ARN_DASHBOARD / ECR_REPOSITORY_DASHBOARD / DASHBOARD_INSTANCE_ID
#   Secrets   GOLD_DATABASE_URL (deploy-airflow.yml 과 공유)
#   EC2       ~/dashboard/.env (compose 가 자동으로 읽음), /root/.docker/config.json
# =============================================================================
name: Deploy Dashboard

on:
  push:
    branches: [develop]
    # ci.yml 의 dashboard 필터와 같아야 합니다. 빠지면 코드가 바뀌었는데 배포가 스킵됩니다.
    paths:
      # `.github/scripts/check_image_filters.py` 가 Dockerfile COPY 와 대조합니다.
      - 'main/dashboard/**'
      - 'schema/**'
      - 'Makefile'
      - '.dockerignore'
      - 'docker-compose.dashboard.ec2.yml'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    name: 이미지 푸시와 EC2 반영
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AWS 임시 자격증명 취득 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DASHBOARD }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 URI 결정
        id: image
        run: |
          sha="$(git rev-parse --short HEAD)"
          echo "uri=${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_DASHBOARD }}:${sha}" >> "$GITHUB_OUTPUT"

      # 로컬과 같은 명령을 씁니다 — CI 에서만 통하는 빌드가 되지 않도록.
      - name: 이미지 빌드
        run: |
          make build \
            RUNTIMES=main/dashboard \
            REGISTRY="${{ steps.ecr.outputs.registry }}/" \
            IMAGE_NAME="${{ vars.ECR_REPOSITORY_DASHBOARD }}"

      - name: 이미지 푸시
        run: docker push "${{ steps.image.outputs.uri }}"

      # .env 에 태그를 적어두면 재부팅 후 compose 가 같은 버전으로 올립니다.
      - name: EC2 반영 (SSM)
        id: ssm
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          INSTANCE: ${{ vars.DASHBOARD_INSTANCE_ID }}
          GOLD_DATABASE_URL: ${{ secrets.GOLD_DATABASE_URL }}
        run: |
          set -euo pipefail
          # compose 파일도 함께 밀어 저장소와 EC2 가 어긋나지 않게 합니다.
          # 셸 따옴표로 조립하면 깨지기 쉬워 파일로 만들어 넘깁니다.
          python3 - <<'PY' > /tmp/params.json
          import base64, json, os
          compose = base64.b64encode(open("docker-compose.dashboard.ec2.yml","rb").read()).decode()
          cmds = [
            "set -eu",
            "mkdir -p /home/ec2-user/dashboard",
            "cd /home/ec2-user/dashboard",
            f"echo {compose} | base64 -d > docker-compose.dashboard.ec2.yml",
            f"echo DASHBOARD_IMAGE={os.environ['IMAGE_URI']} > .env",
            f"echo GOLD_DATABASE_URL={os.environ['GOLD_DATABASE_URL']} >> .env",
            "chown ec2-user:ec2-user docker-compose.dashboard.ec2.yml .env",
            # 수동 검증 때 `docker run -p 8501:8501`로 띄운 컨테이너가 compose 밖에
            # 남아있으면 compose가 못 건드려서 "port is already allocated"로 죽습니다
            # (deploy-server.yml과 같은 문제). 이름과 무관하게 8501을 쥔 컨테이너를
            # 먼저 정리합니다.
            "docker ps -q --filter publish=8501 | xargs -r docker rm -f",
            "docker compose -f docker-compose.dashboard.ec2.yml up -d --pull always --force-recreate dashboard",
            # 배포마다 이미지가 쌓여 디스크를 채웁니다. 되돌릴 때는 ECR 에서 다시
            # 받으면 되고 pull 은 1초 내입니다.
            "docker image prune -af",
          ]
          print(json.dumps({"commands": cmds}))
          PY
          cid=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --comment "deploy-dashboard ${{ github.sha }}" \
            --parameters file:///tmp/params.json \
            --query 'Command.CommandId' --output text)
          echo "command_id=$cid" >> "$GITHUB_OUTPUT"
          echo "CommandId=$cid"

      # 기다리지 않으면 명령이 실패해도 워크플로가 초록불로 끝납니다.
      - name: SSM 명령 결과 확인
        run: |
          set -uo pipefail
          sleep 5
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ vars.DASHBOARD_INSTANCE_ID }}" || true
          status=$(aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ vars.DASHBOARD_INSTANCE_ID }}" \
            --query Status --output text)
          echo "상태: $status"
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.command_id }}" \
            --instance-id "${{ vars.DASHBOARD_INSTANCE_ID }}" \
            --query StandardOutputContent --output text
          if [ "$status" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "${{ steps.ssm.outputs.command_id }}" \
              --instance-id "${{ vars.DASHBOARD_INSTANCE_ID }}" \
              --query StandardErrorContent --output text
            echo "::error::EC2 반영이 실패했습니다. 이미지는 푸시됐습니다: ${{ steps.image.outputs.uri }}"
            exit 1
          fi

      - name: 배포 요약
        run: |
          echo "### Dashboard 배포 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "- 이미지: \`${{ steps.image.outputs.uri }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 인스턴스: \`${{ vars.DASHBOARD_INSTANCE_ID }}\`" >> "$GITHUB_STEP_SUMMARY"
