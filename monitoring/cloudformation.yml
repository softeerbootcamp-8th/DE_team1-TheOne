AWSTemplateFormatVersion: "2010-09-09"
Description: TheOne unified EC2 and EMR Serverless resource monitoring

Parameters:
  EmrApplicationId:
    Type: String
  AirflowInstanceId:
    Type: AWS::EC2::Instance::Id
  SourceInstanceId:
    Type: AWS::EC2::Instance::Id
  DashboardInstanceId:
    Type: AWS::EC2::Instance::Id
  AirflowInstanceRoleName:
    Type: String
    Default: theone-airflow-role
  SourceInstanceRoleName:
    Type: String
    Default: theone-source-api-server
  DashboardInstanceRoleName:
    Type: String
    Default: theone-dashboard-role

Resources:
  AgentMetricPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: theone-cloudwatch-agent-metrics
      Roles:
        - !Ref AirflowInstanceRoleName
        - !Ref SourceInstanceRoleName
        - !Ref DashboardInstanceRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublishHostMetrics
            Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: "*"
            Condition:
              StringEquals:
                cloudwatch:namespace: TheOne/EC2
          - Sid: ReadInstanceMetadata
            Effect: Allow
            Action:
              - ec2:DescribeTags
              - ec2:DescribeVolumes
            Resource: "*"
          - Sid: ReadAgentConfiguration
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/AmazonCloudWatch-TheOne-EC2

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: theone-pipeline-alerts

  AlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref AlertTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertTopic
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId

  EmrJobFailureRule:
    Type: AWS::Events::Rule
    Properties:
      Name: theone-emr-job-failed-or-cancelled
      State: ENABLED
      EventPattern:
        source: [aws.emr-serverless]
        detail-type: [EMR Serverless Job Run State Change]
        detail:
          applicationId: [!Ref EmrApplicationId]
          state: [FAILED, CANCELLED]
      Targets:
        - Arn: !Ref AlertTopic
          Id: theone-pipeline-alerts

  UnifiedDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: theone-infrastructure-prod
      DashboardBody: !Sub |
        {
          "start": "-PT12H",
          "periodOverride": "inherit",
          "widgets": [
            {
              "type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": {"markdown": "# TheOne infrastructure\nEC2 host resources and EMR Serverless Spark resources"}
            },
            {
              "type": "metric", "x": 0, "y": 2, "width": 8, "height": 6,
              "properties": {
                "title": "EC2 CPU (%)", "region": "${AWS::Region}", "period": 60,
                "stat": "Average", "yAxis": {"left": {"min": 0, "max": 100}},
                "metrics": [
                  ["AWS/EC2", "CPUUtilization", "InstanceId", "${AirflowInstanceId}", {"label": "Airflow"}],
                  [".", ".", ".", "${SourceInstanceId}", {"label": "Source API"}],
                  [".", ".", ".", "${DashboardInstanceId}", {"label": "Dashboard"}]
                ]
              }
            },
            {
              "type": "metric", "x": 8, "y": 2, "width": 8, "height": 6,
              "properties": {
                "title": "EC2 memory (%)", "region": "${AWS::Region}", "period": 60,
                "stat": "Average", "yAxis": {"left": {"min": 0, "max": 100}},
                "metrics": [
                  ["TheOne/EC2", "mem_used_percent", "InstanceId", "${AirflowInstanceId}", {"label": "Airflow"}],
                  [".", ".", ".", "${SourceInstanceId}", {"label": "Source API"}],
                  [".", ".", ".", "${DashboardInstanceId}", {"label": "Dashboard"}]
                ]
              }
            },
            {
              "type": "metric", "x": 16, "y": 2, "width": 8, "height": 6,
              "properties": {
                "title": "EC2 root disk (%)", "region": "${AWS::Region}", "period": 60,
                "stat": "Average", "yAxis": {"left": {"min": 0, "max": 100}},
                "metrics": [
                  ["TheOne/EC2", "disk_used_percent", "InstanceId", "${AirflowInstanceId}", {"label": "Airflow"}],
                  [".", ".", ".", "${SourceInstanceId}", {"label": "Source API"}],
                  [".", ".", ".", "${DashboardInstanceId}", {"label": "Dashboard"}]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 8, "width": 24, "height": 4,
              "properties": {
                "title": "EMR Serverless job states", "view": "singleValue",
                "region": "${AWS::Region}", "period": 60, "stat": "Sum",
                "metrics": [
                  [{"expression": "SUM(SEARCH('Namespace=\"AWS/EMRServerless\" MetricName=\"RunningJobs\" ApplicationId=\"${EmrApplicationId}\"', 'Sum'))", "label": "Running", "id": "running"}],
                  [{"expression": "SUM(SEARCH('Namespace=\"AWS/EMRServerless\" MetricName=\"PendingJobs\" ApplicationId=\"${EmrApplicationId}\"', 'Sum'))", "label": "Pending", "id": "pending"}],
                  [{"expression": "SUM(SEARCH('Namespace=\"AWS/EMRServerless\" MetricName=\"FailedJobs\" ApplicationId=\"${EmrApplicationId}\"', 'Sum'))", "label": "Failed", "id": "failed"}],
                  [{"expression": "SUM(SEARCH('Namespace=\"AWS/EMRServerless\" MetricName=\"SuccessJobs\" ApplicationId=\"${EmrApplicationId}\"', 'Sum'))", "label": "Success", "id": "success"}]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "EMR worker memory usage (%)", "region": "${AWS::Region}",
                "period": 60, "yAxis": {"left": {"min": 0, "max": 100}},
                "metrics": [
                  [{"expression": "SUM(SEARCH('Namespace=\"AWS/EMRServerless\" MetricName=\"WorkerMemoryAllocated\" ApplicationId=\"${EmrApplicationId}\" WorkerType=\"SPARK_EXECUTORS\"', 'Sum'))", "id": "ema", "visible": false}],
                  [{"expression": "SUM(SEARCH('Namespace=\"AWS/EMRServerless\" MetricName=\"WorkerMemoryUsed\" ApplicationId=\"${EmrApplicationId}\" WorkerType=\"SPARK_EXECUTORS\"', 'Sum'))", "id": "emu", "visible": false}],
                  [{"expression": "IF(ema>0,100*emu/ema,0)", "label": "Executor", "id": "emp"}],
                  [{"expression": "SUM(SEARCH('Namespace=\"AWS/EMRServerless\" MetricName=\"WorkerMemoryAllocated\" ApplicationId=\"${EmrApplicationId}\" WorkerType=\"SPARK_DRIVER\"', 'Sum'))", "id": "dma", "visible": false}],
                  [{"expression": "SUM(SEARCH('Namespace=\"AWS/EMRServerless\" MetricName=\"WorkerMemoryUsed\" ApplicationId=\"${EmrApplicationId}\" WorkerType=\"SPARK_DRIVER\"', 'Sum'))", "id": "dmu", "visible": false}],
                  [{"expression": "IF(dma>0,100*dmu/dma,0)", "label": "Driver", "id": "dmp"}]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "EMR worker CPU usage (%)", "region": "${AWS::Region}",
                "period": 60, "yAxis": {"left": {"min": 0, "max": 100}},
                "metrics": [
                  [{"expression": "SUM(SEARCH('Namespace=\"AWS/EMRServerless\" MetricName=\"WorkerCpuAllocated\" ApplicationId=\"${EmrApplicationId}\" WorkerType=\"SPARK_EXECUTORS\"', 'Sum'))", "id": "eca", "visible": false}],
                  [{"expression": "SUM(SEARCH('Namespace=\"AWS/EMRServerless\" MetricName=\"WorkerCpuUsed\" ApplicationId=\"${EmrApplicationId}\" WorkerType=\"SPARK_EXECUTORS\"', 'Sum'))", "id": "ecu", "visible": false}],
                  [{"expression": "IF(eca>0,100*ecu/eca,0)", "label": "Executor", "id": "ecp"}],
                  [{"expression": "SUM(SEARCH('Namespace=\"AWS/EMRServerless\" MetricName=\"WorkerCpuAllocated\" ApplicationId=\"${EmrApplicationId}\" WorkerType=\"SPARK_DRIVER\"', 'Sum'))", "id": "dca", "visible": false}],
                  [{"expression": "SUM(SEARCH('Namespace=\"AWS/EMRServerless\" MetricName=\"WorkerCpuUsed\" ApplicationId=\"${EmrApplicationId}\" WorkerType=\"SPARK_DRIVER\"', 'Sum'))", "id": "dcu", "visible": false}],
                  [{"expression": "IF(dca>0,100*dcu/dca,0)", "label": "Driver", "id": "dcp"}]
                ]
              }
            }
          ]
        }

Outputs:
  DashboardName:
    Value: !Ref UnifiedDashboard
  AlertTopicArn:
    Value: !Ref AlertTopic
