# EMR Serverless 알림 규칙 (CloudWatch 데이터소스).
#
# 작업 실패는 예전에 EventBridge -> SNS -> 이메일로 갔습니다. 그 경로를 걷어내고
# 여기로 옮겼습니다 — 호스트·Lambda 와 같은 Slack 수신처를 쓰므로 창구가 하나입니다.
#
# ★ 창 크기와 for 를 겹치면 알림이 늦습니다
#
#   15분 창 + reduce(max) + for: 15m 로 뒀더니 **상황이 끝난 뒤에 알림이 왔습니다.**
#   실측: 12:27~12:45 에 19분 동안 상한(12)에 붙어 있었는데 알림은 13:01 에 왔습니다.
#
#   max 가 창 안의 최댓값을 보므로 값이 이미 내려가도 조건이 참으로 남고, for 가 그
#   "번진 값" 위에서 15분을 더 셉니다.
#
#   창은 좁게(5분) 두고 reduce 는 last 를 씁니다. 지속 여부는 for 가 봅니다.
#   같은 구간을 재생하면 옛 규칙은 20회(끝난 뒤 포함), 새 규칙은 포화가 진행 중인
#   12:44~45 에만 발사합니다.
#
# ★ 임계는 상한 도달(>=)입니다
#
#   할당이 상한에 닿으면 새 워커가 못 뜹니다 — 사용량이 낮아도 작업이 대기합니다.
#   그래서 사용량(WorkerCpuUsed)이 아니라 할당량(CPUAllocated)을 봅니다.
#
#   다만 `>=` 만 보면 안 됩니다. 애플리케이션 단위 지표라 값이 없는 분에 할당과 상한이
#   함께 0 으로 내려오고, `0 >= 0` 이 참이 되어 헛알림이 갑니다. 그래서 할당이 0 이
#   아닐 것과, 워커가 실제로 못 떠서 대기 중일 것(PendingCreationWorkerCount)을
#   함께 봅니다 — 상한에 닿아도 작업이 안 밀리면 알릴 이유가 없습니다.
#
#   근거는 대시보드 '용량 상한 도달 (알림 근거)' 패널에 그리고, 수치는 알림 본문에도
#   함께 실어 보냅니다. 알림만 오고 화면에는 근거가 없으면 사람이 오탐으로 판단합니다
#   — 실제로 그렇게 헷갈렸습니다. 사용량 패널에는 넣지 않습니다: 0 으로 자주 떨어져
#   Spark 사용량 곡선을 읽기 어렵게 만듭니다.
#
# Lambda 규칙과 같은 이유로 A -> reduce -> threshold/math 단계를 거칩니다. Grafana 알림은
# 축약된 값만 비교할 수 있고 CloudWatch 는 항상 시계열입니다.
#
# 차원에 ApplicationName 을 함께 줍니다. ApplicationId 만 주면 matchExact 가 맞지 않아
# 0계열이 되고, 규칙은 남고 평가만 비어 있게 됩니다(실측).
apiVersion: 1
groups:
- orgId: 1
  name: emr
  folder: theone
  interval: 1m
  rules:
  - uid: theone-emr-job-failed
    title: EMR 작업 실패
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: theone-cloudwatch
      model:
        refId: A
        namespace: AWS/EMRServerless
        metricName: FailedJobs
        statistic: Sum
        dimensions:
          ApplicationId: ${EMR_APPLICATION_ID}
          ApplicationName: '*'
        matchExact: true
        region: default
        metricQueryType: 0
        metricEditorMode: 0
        period: '60'
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: sum
        settings:
          mode: dropNN
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            type: last
            params: []
          type: query
        intervalMs: 60000
        maxDataPoints: 43200
    noDataState: OK
    execErrState: Error
    for: 0m
    labels:
      severity: critical
    annotations:
      summary: EMR Serverless 작업이 실패했습니다. Airflow 태스크 알림도 함께 옵니다.
  - uid: theone-emr-capacity-full
    title: EMR 용량 상한 도달
    condition: E
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: theone-cloudwatch
      model:
        refId: A
        namespace: AWS/EMRServerless
        metricName: CPUAllocated
        statistic: Maximum
        dimensions:
          ApplicationId: ${EMR_APPLICATION_ID}
          ApplicationName: '*'
        matchExact: true
        region: default
        metricQueryType: 0
        metricEditorMode: 0
        period: '60'
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: theone-cloudwatch
      model:
        refId: B
        namespace: AWS/EMRServerless
        metricName: MaxCPUAllowed
        statistic: Maximum
        dimensions:
          ApplicationId: ${EMR_APPLICATION_ID}
          ApplicationName: '*'
        matchExact: true
        region: default
        metricQueryType: 0
        metricEditorMode: 0
        period: '60'
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: D
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        refId: D
        type: reduce
        expression: B
        reducer: last
        settings:
          mode: dropNN
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: F
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: theone-cloudwatch
      model:
        refId: F
        namespace: AWS/EMRServerless
        metricName: PendingCreationWorkerCount
        statistic: Maximum
        dimensions:
          ApplicationId: ${EMR_APPLICATION_ID}
          ApplicationName: '*'
        matchExact: true
        region: default
        metricQueryType: 0
        metricEditorMode: 0
        period: '60'
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: G
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        refId: G
        type: reduce
        expression: F
        reducer: last
        settings:
          mode: dropNN
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: E
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        refId: E
        type: math
        expression: $C >= $D && $C > 0 && $G > 0
        intervalMs: 60000
        maxDataPoints: 43200
    noDataState: OK
    execErrState: Error
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: >-
        EMR CPU 할당이 15분 넘게 상한에 닿아 새 워커가 못 뜨고 있습니다 —
        할당 {{ printf "%.0f" $values.C.Value }} / 상한 {{ printf "%.0f" $values.D.Value }} vCPU,
        생성 대기 워커 {{ printf "%.0f" $values.G.Value }}개.
        대시보드 '용량 상한 도달 (알림 근거)' 패널을 보세요.
