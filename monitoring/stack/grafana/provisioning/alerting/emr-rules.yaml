# EMR Serverless 알림 규칙 (CloudWatch 데이터소스).
#
# 작업 실패는 예전에 EventBridge -> SNS -> 이메일로 갔습니다. 그 경로를 걷어내고
# 여기로 옮겼습니다 — 호스트·Lambda 와 같은 Slack 수신처를 쓰므로 창구가 하나입니다.
#
# ★ 창 크기와 for 를 겹치면 알림이 늦습니다
#
#   15분 창 + reduce(max) + for: 15m 로 뒀더니 **상황이 끝난 뒤에 알림이 왔습니다.**
#   실측: 12:27~12:45 에 19분 동안 상한(12)에 붙어 있었는데 알림은 13:01 에 왔습니다.
#
#   max 가 창 안의 최댓값을 보므로 값이 이미 내려가도 조건이 참으로 남고, for 가 그
#   "번진 값" 위에서 15분을 더 셉니다. 그래서 실제 포화 시작보다 한참 뒤에 발사됩니다.
#
#   창은 좁게(5분) 두고 reduce 는 last 를 씁니다. 지속 여부는 for 가 봅니다.
#   같은 구간을 재생해 보면 옛 규칙은 20회(끝난 뒤 포함), 새 규칙은 포화가 진행 중인
#   12:44~45 에만 발사합니다.
#
#   임계를 95% 로 낮췄지만 실측에서는 100% 와 결과가 같았습니다 — CPUAllocated 가
#   0/2/8/12 처럼 띄엄띄엄한 값이라 11.4 와 12 사이에 값이 없습니다. 워커 크기가
#   달라지면 그때 차이가 납니다.
#
# 임계는 상한의 95% 입니다. 100% 를 기다리면 이미 작업이 대기하기 시작한 뒤입니다.
#
# 용량 알림은 CPUAllocated(할당량)를 봅니다 — 대시보드 패널의 WorkerCpuUsed(사용량)와
# 다른 지표입니다. 할당이 상한에 닿으면 사용량이 낮아도 새 워커가 못 뜹니다.
#
# Lambda 규칙과 같은 이유로 A -> reduce -> threshold/math 단계를 거칩니다. Grafana 알림은
# 축약된 값만 비교할 수 있고 CloudWatch 는 항상 시계열입니다.
#
# 차원에 ApplicationName 을 함께 줍니다. ApplicationId 만 주면 matchExact 가 맞지 않아
# 0계열이 되고, 규칙은 남고 평가만 비어 있게 됩니다(실측).
apiVersion: 1
groups:
- orgId: 1
  name: emr
  folder: theone
  interval: 1m
  rules:
  - uid: theone-emr-job-failed
    title: EMR 작업 실패
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: theone-cloudwatch
      model:
        refId: A
        namespace: AWS/EMRServerless
        metricName: FailedJobs
        statistic: Sum
        dimensions:
          ApplicationId: ${EMR_APPLICATION_ID}
          ApplicationName: '*'
        matchExact: true
        region: default
        metricQueryType: 0
        metricEditorMode: 0
        period: '60'
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: __expr__
      model:
        refId: B
        type: reduce
        expression: A
        reducer: sum
        settings:
          mode: dropNN
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            type: last
            params: []
          type: query
        intervalMs: 60000
        maxDataPoints: 43200
    noDataState: OK
    execErrState: Error
    for: 0m
    labels:
      severity: critical
    annotations:
      summary: EMR Serverless 작업이 실패했습니다. Airflow 태스크 알림도 함께 옵니다.
  - uid: theone-emr-capacity-full
    title: EMR 용량 상한 도달
    condition: E
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: theone-cloudwatch
      model:
        refId: A
        namespace: AWS/EMRServerless
        metricName: CPUAllocated
        statistic: Maximum
        dimensions:
          ApplicationId: ${EMR_APPLICATION_ID}
          ApplicationName: '*'
        matchExact: true
        region: default
        metricQueryType: 0
        metricEditorMode: 0
        period: '60'
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: theone-cloudwatch
      model:
        refId: B
        namespace: AWS/EMRServerless
        metricName: MaxCPUAllowed
        statistic: Maximum
        dimensions:
          ApplicationId: ${EMR_APPLICATION_ID}
          ApplicationName: '*'
        matchExact: true
        region: default
        metricQueryType: 0
        metricEditorMode: 0
        period: '60'
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: C
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        refId: C
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: D
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        refId: D
        type: reduce
        expression: B
        reducer: last
        settings:
          mode: dropNN
        intervalMs: 60000
        maxDataPoints: 43200
    - refId: E
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: __expr__
      model:
        refId: E
        type: math
        expression: $C >= $D * 0.95
        intervalMs: 60000
        maxDataPoints: 43200
    noDataState: OK
    execErrState: Error
    for: 15m
    labels:
      severity: warning
    annotations:
      summary: EMR 이 15분 넘게 CPU 할당을 상한의 95% 이상으로 유지하고 있습니다. 새 워커가 못 떠서 작업이 대기할 수 있습니다 — maximumCapacity
        를 올려야 할 수 있습니다.
