# 린트만 합니다 — 포매터(`ruff format`)는 쓰지 않습니다.
#
# 포매터를 붙이면 첫 실행에서 사실상 전 파일이 바뀌어 `git blame` 이 통째로 끊깁니다.
# 이 저장소는 코드 스타일이 이미 일관되고 팀이 작아서, 그 비용을 낼 이유가 없습니다.
#
# 규칙을 F·E9 로만 좁힌 이유
# ------------------------
# 이 둘은 "스타일" 이 아니라 "버그 냄새" 입니다 — 정의 안 된 이름(F821), 미사용
# import·변수(F401/F841), 이름 가림(F402), 문법·들여쓰기 오류(E9).
# E(pycodestyle 전반)나 I(import 정렬)까지 켜면 즉시 수백 건이 뜨고, 그걸 고치는
# 커밋이 실제 작업과 섞여 리뷰가 불가능해집니다. 넓히려면 별도 PR 로 하세요.
target-version = "py311"

# 각 런타임의 uv 가상환경. ruff 기본 exclude 가 잡아주지만, 여기 명시해 두면
# 이름이 다른 환경(.venv-arm 등)이 생겼을 때 어디를 고칠지 분명해집니다.
exclude = [".venv", "**/.venv"]

[lint]
select = ["F", "E9"]
