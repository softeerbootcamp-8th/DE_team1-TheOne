# =============================================================================
# versions.toml  —  팀 공용 버전 매니페스트 (Single Source of Truth)
# -----------------------------------------------------------------------------
# 팀원 누구든 "우리 프로젝트가 무슨 버전을 쓰지?"를 여기 한 곳만 보면 됩니다.
# Docker로 못 덮는 관리형 런타임(EMR)까지 여기서 코드로 고정합니다.
# 이 값을 Terraform / DAG 설정 / Dockerfile ARG 가 참조하도록 배선하세요.
# =============================================================================

[language]
python = "3.11"              # 전 런타임 통일 (EMR 7.13 PySpark 기본값과 일치)

[orchestration]
airflow = "3.3.0"
# provider 버전은 개별 고정하지 않고 아래 constraints 파일이 일괄 고정
airflow_constraints = "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.0/constraints-3.11.txt"
executor = "LocalExecutor"

[compute]
# EMR은 컨테이너로 못 잡으므로 release label 고정이 곧 버전 관리
emr_release = "emr-7.13.0"   # → Spark 3.5.6-amzn-2 / Python 3.11 고정
spark = "3.5.6"              # 로컬 단위테스트용 pyspark 핀과 일치시킬 것

[serving]
postgres = "16"              # RDS PostgreSQL (Airflow 3.3은 13~17 지원)

[infra]
terraform = "1.9.x"
aws_cli = "2.x"

[tooling]
uv = "0.12.x"                # 의존성 잠금 + Python 버전 관리 도구
# uv 는 버전이 달라도 uv.lock 을 그대로 읽습니다(0.5 ↔ 0.12 확인).
# 팀원끼리 uv 버전이 조금 달라도 락파일이 흔들리지 않습니다.
