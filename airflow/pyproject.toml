[project]
name = "tlc-airflow"
version = "0.1.0"
requires-python = "==3.11.*"

# 직접 의존성은 리뷰에서 변경이 드러나도록 ==로 고정합니다.
# 실제 설치되는 전체 의존성 버전은 uv.lock이 고정합니다.
dependencies = [
    "apache-airflow==3.3.0",
    "apache-airflow-providers-standard==1.15.0",
    "apache-airflow-providers-amazon==9.31.0",       # S3 / EMR / Lambda / RDS
    "apache-airflow-providers-postgres==6.8.0",      # 메타DB + 서빙 DB
    "apache-airflow-providers-apache-spark==6.2.0",
    "apache-airflow-providers-http==6.0.4",          # vPIC / EIA / NREL API
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
    "pandas==2.1.4",
    "numpy==1.26.4",    # pandas 2.1.4 는 numpy 2.x 와 호환되지 않음
    "pyarrow==24.0.0",
    # DAG 가 lambda/functions 핸들러를 그대로 import 하므로 그쪽 의존성도 필요합니다.
    # 렌탈 차량 대장은 가격이 이미지 안에만 있어 OCR 로 읽습니다.
    # tesseract 바이너리는 Dockerfile 에서 설치합니다 (lambda 쪽과 같은 버전 고정).
    "pytesseract==0.3.13",
    "pillow==12.3.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
