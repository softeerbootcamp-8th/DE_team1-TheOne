[project]
name = "tlc-airflow"
version = "0.1.0"
requires-python = "==3.11.*"

# 직접 의존성은 리뷰에서 변경이 드러나도록 ==로 고정합니다.
# 실제 설치되는 전체 의존성 버전은 uv.lock이 고정합니다.
dependencies = [
    "apache-airflow==3.3.0",
    "apache-airflow-providers-standard==1.15.0",
    "apache-airflow-providers-amazon==9.31.0",       # S3 / EMR / Lambda / RDS
    "apache-airflow-providers-postgres==6.8.0",      # 메타DB + 서빙 DB
    # ★ apache-airflow-providers-apache-spark 를 쓰지 않습니다. 그 provider 는
    #   pyspark 가 아니라 pyspark-client(Spark Connect 전용)를 끌어와서, 같은
    #   `pyspark` 모듈명을 선점한 채 spark/common/session.py 의 .master("local[1]")
    #   을 CONNECT_URL_NOT_SET 으로 실패시킵니다. 둘을 함께 선언해도 해결되지
    #   않아 provider 를 뺐습니다 — 코드에서 SparkSubmitOperator 등 실사용은
    #   없었고, hvfhv DAG 는 BashOperator 로 job.py 를 직접 부릅니다 (#327).
    #   spark/pyproject.toml 과 버전이 같아야 합니다. 한쪽만 바꾸지 마세요.
    #   JVM 은 airflow/Dockerfile 의 default-jre-headless 가 제공합니다.
    "pyspark==3.5.6",
    "apache-airflow-providers-http==6.0.4",          # vPIC / EIA / NREL API
    # 실패 알림. 없으면 slack_failure_callback 이 로그 폴백으로 조용히 강등됩니다 (#546).
    # 로컬에서 알림을 끄려면 이걸 빼지 말고 slack_webhook Connection 을 안 만들면 됩니다.
    "apache-airflow-providers-slack==9.10.2",
    # ─── 아래는 DAG 가 lambda/functions 핸들러를 그대로 import 하기 때문에 필요합니다.
    #     lambda/pyproject.toml 과 버전이 정확히 같아야 합니다. 어긋나면 로컬에서
    #     통과한 코드가 Lambda 이미지에서 다르게 돕니다. 한쪽만 바꾸지 마세요.
    #     상한은 lambda 쪽 베이스 이미지(AL2 = glibc 2.26)가 정합니다 — #125 참고.
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
    "pyarrow==20.0.0",
    "boto3==1.43.65",   # S3 적재. provider 전이분에 맡기면 버전이 조용히 떠다닙니다.
    # 렌탈 차량 대장은 가격이 이미지 안에만 있어 OCR 로 읽습니다.
    # tesseract 바이너리는 Dockerfile 에서 설치합니다.
    "pytesseract==0.3.13",
    "pillow==11.3.0",
    # EIA 공개 통계는 스프레드시트로만 배포됩니다. Airflow 가 Lambda 핸들러를 같은
    # 프로세스에서 부르므로(`lambda_handler_for`) 여기에도 파서가 있어야 합니다.
    "xlrd==2.0.2",      # EIA 휘발유 (.xls, 구형 BIFF)
    "openpyxl==3.1.5",  # EIA 전력 (.xlsx)
    # 적재 결과의 값 수준 검증용. DAG 검증 태스크가 보는 건 경로·행 수·스키마까지라
    # 값 범위나 널 비율은 못 봅니다.
    # ★ marshmallow 를 4.3.0 -> 3.26.2 로 끌어내립니다. providers-amazon 도 같은 걸
    #   쓰므로, 이 버전을 올릴 때 Airflow 기동까지 확인해야 합니다 (#256).
    "great-expectations==1.20.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = [".", "dags", "../.."]
