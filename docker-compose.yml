# =============================================================================
# 로컬 개발 환경 — docker compose up 한 줄로 Airflow 가 뜹니다.
#
#   docker compose up -d        # 띄우기 (첫 실행은 이미지 빌드로 몇 분 걸림)
#   docker compose logs -f      # 로그 보기
#   docker compose down         # 내리기
#   docker compose down -v      # 내리면서 DB 까지 초기화
#
# UI: http://localhost:8080 — 로그인 없이 바로 들어갑니다 (아래 all_admins 참고).
#
# Airflow 이미지 안의 라이브러리 버전은 main/airflow/uv.lock 과 같은 조합입니다.
#
# ⚠️ 이 파일은 로컬 개발 전용입니다. EC2 등 운영 배포에 그대로 재사용하지 마세요.
#    특히 AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS 는 로그인 자체를 없애는
#    설정이라 운영에서 켜지면 인증이 뚫립니다. 운영 배포 설정은 별도 파일로 분리하세요.
# =============================================================================

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "airflow" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow:
    # shared/airflow/Dockerfile을 빌드해서 씁니다(uv.lock으로 고정된 패키지 포함).
    # 컨텍스트는 저장소 루트입니다 — Dockerfile 의 COPY 경로가 `main/airflow/...` 로
    # 시작해서(`make build` 와 동일) 여기를 ./airflow 로 두면 빌드가 실패합니다.
    build:
      context: .
      dockerfile: shared/airflow/Dockerfile
    # DAG 는 저장소 루트의 data/ 에 Bronze·Silver 를 씁니다. 이미지 기본 uid(50000)로
    # 돌면 호스트 소유(uid 1000)인 마운트에 쓰지 못해 PermissionError 가 납니다.
    # gid 는 0 을 유지해야 합니다 — /opt/airflow 가 airflow:root 775 라 gid 0 으로 씁니다.
    # uid 가 1000 이 아니면: AIRFLOW_UID=$(id -u) docker compose up -d
    user: "${AIRFLOW_UID:-1000}:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # 기본값 300초(5분). 로컬 개발에서 DAG 고치고 5분 기다리긴 불편하므로 10초로.
      # 운영에서는 기본값을 쓰세요 (잦은 재파싱은 부하입니다).
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "10"
      # 로그인 화면을 없애서 매번 `docker compose logs | grep password` 하는 걸 방지합니다.
      # 인증된 모든 요청을 admin 으로 취급 — 로컬 1인 개발 전용. 운영 배포 시 반드시 제거하세요.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      PYTHONPATH: /opt/airflow/project-root
    ports:
      # 8080 이 다른 프로젝트에 물려 있으면 AIRFLOW_PORT=8090 docker compose up -d
      - "${AIRFLOW_PORT:-8080}:8080"
    volumes:
      # DAG 를 로컬에서 고치면 컨테이너에 바로 반영됩니다 (재빌드 불필요)
      - ./main/airflow/dags:/opt/airflow/dags/main
      - ./sub/airflow/dags:/opt/airflow/dags/sub
      - ./config:/opt/airflow/project-config:ro
      - .:/opt/airflow/project-root
    # standalone = api-server + scheduler + dag-processor + triggerer 를 한 번에
    command: standalone
    restart: unless-stopped

volumes:
  postgres-db:
