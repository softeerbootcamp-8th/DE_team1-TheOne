[project]
name = "tlc-lambda"
version = "0.1.0"
requires-python = "==3.11.*"

# 수집 함수 공용 의존성. 함수별로 더 가벼워야 하면 함수 폴더에 개별 pyproject 로 분리.
dependencies = [
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",  # crawl_rental
    "lxml==6.1.1",
    # vehicle_catalog_raw_to_bronze: 가격이 카드 이미지 안에만 있어 OCR 로 읽습니다.
    # tesseract 바이너리(>=5.0)가 따로 필요합니다 — docs/GETTING_STARTED.md 참고.
    "pytesseract==0.3.13",
    # ★ pillow / pyarrow 상한은 Lambda 베이스 이미지가 정합니다.
    #   public.ecr.aws/lambda/python:3.11 은 Amazon Linux 2 = glibc 2.26 인데,
    #   pillow 12 / pyarrow 21 부터 manylinux_2_28(glibc 2.28+) wheel 만 냅니다.
    #   더 올리면 pip 이 sdist 로 폴백해 이미지 빌드가 컴파일러 부재로 실패합니다.
    #   올리려면 베이스를 AL2023(python:3.12+)으로 함께 올려야 합니다.
    "pillow==11.3.0",
    "boto3==1.43.65",           # S3 적재 (bronze/*)
    "python-dotenv==1.2.1",     # 로컬 개발용 .env 로드 (Lambda 런타임에서는 미사용)
    "pyarrow==20.0.0",          # parquet 쓰기 (uber_eligible_vehicles_raw_to_bronze)
    # EIA 공개 통계는 스프레드시트로만 배포됩니다. 셀만 읽으면 되므로 pandas 는
    # 넣지 않습니다 — 이 런타임은 Lambda 이미지 크기를 이유로 pandas 를 안 씁니다.
    "xlrd==2.0.2",              # EIA 휘발유 (.xls, 구형 BIFF)
    "openpyxl==3.1.5",          # EIA 전력 (.xlsx)
    "pipeline-core",            # 공통 Extractor/Transformer/Loader/Pipeline
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "moto==5.2.2",   # AWS 모킹
    "xlwt==1.3.0",   # 테스트용 구형 xls 작성 (EIA 휘발유 원본 모양 재현)
]

[tool.uv.sources]
pipeline-core = { path = "../libs/pipeline_core" }

[tool.pytest.ini_options]
pythonpath = [".", ".."]  # ".." 는 저장소 루트의 schema 패키지(schema.bronze.*) 참조용
