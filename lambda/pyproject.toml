[project]
name = "tlc-lambda"
version = "0.1.0"
requires-python = "==3.11.*"

# 수집 함수 공용 의존성. 함수별로 더 가벼워야 하면 함수 폴더에 개별 pyproject 로 분리.
dependencies = [
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",  # crawl_rental
    "lxml==6.1.1",
    # fasttrack_vehicle_pricing: 가격이 카드 이미지 안에만 있어 OCR 로 읽습니다.
    # tesseract 바이너리(>=5.0)가 따로 필요합니다 — docs/GETTING_STARTED.md 참고.
    "pytesseract==0.3.13",
    "pillow==12.3.0",
    "boto3==1.43.65",           # S3 적재 (bronze/*)
    "pyarrow==22.0.0",          # parquet 쓰기 (uber_eligible_vehicles)
]

[dependency-groups]
dev = ["pytest==9.1.1", "moto==5.2.2"]  # moto: AWS 모킹
